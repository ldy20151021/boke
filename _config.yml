# The Site Configuration

theme: jekyll-theme-chirpy

lang: zh-CN
timezone: Asia/Shanghai

title: 我的博客
tagline: 示例博客
description: >-
  使用 Chirpy 主题的 Jekyll 博客

url: "https://ldy20151021.github.io"
baseurl: "/boke"

github:
  username: ldy20151021

social:
  name: ldy20151021
  links:
    - https://github.com/ldy20151021

paginate: 10

plugins:
  - jekyll-paginate
  - jekyll-archives
  - jekyll-seo-tag
  - jekyll-feed

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /category/:name/
    tag: /tag/:name/
